apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-api
  namespace: default
  labels:
    app.kubernetes.io/name: user-api
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-api
    spec:
      containers:
        - name: server
          image: meta/user-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          
          # We use envFrom for independent variables like SERVER_PORT
          envFrom:
            - configMapRef:
                name: user-api-config

          # We must explicitly list variables in 'env' to use them for concatenation
          env:
            # 1. Define Secrets First
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: user-api-postgres-creds
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-api-postgres-creds
                  key: password
            
            # 2. Define ConfigMap Variables Explicitly (Required for $(VAR) expansion)
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: user-api-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: user-api-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: user-api-config
                  key: POSTGRES_DB

            # 3. Concatenate the URL using the variables defined above
            # Syntax: postgres://user:password@host:port/dbname?sslmode=disable
            - name: POSTGRES_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
            
            # 4. Other Secrets
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-api-secrets
                  key: JWT_SECRET
  

---
apiVersion: v1
kind: Service
metadata:
  name: user-api
  namespace: default
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: user-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080