apiVersion: v1
kind: ConfigMap
metadata:
  # Matches the envFrom reference in the first Deployment file
  name: song-api-config
  namespace: default
data:
  SEGMENT_DURATION: "10"
  MAX_PAGE_SIZE: "10"

  SERVER_PORT: "8080"

  POSTGRES_HOST: "song-postgres-rw"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "song_db"

  REDIS_ADDR: "song-redis:6379"
  REDIS_DB: "0"
