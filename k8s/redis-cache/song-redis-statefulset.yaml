apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: song-redis
  namespace: default
  labels:
    app.kubernetes.io/name: song-redis
    app.kubernetes.io/component: cache
spec:
  # This must match a Headless Service name (not shown here, but assumed 'song-redis')
  serviceName: "song-redis"
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: song-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: song-redis
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Matches the secret name used in the API Deployment
                  name: song-api-redis-creds
                  # Matches the lower-case key used in previous steps
                  key: password
          volumeMounts:
            - name: redis-data
              mountPath: /data
  
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi