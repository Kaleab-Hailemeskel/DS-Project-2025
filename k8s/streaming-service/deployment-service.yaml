apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-api
  namespace: default
  labels:
    app.kubernetes.io/name: streaming-api
    app.kubernetes.io/component: streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: streaming-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streaming-api
    spec:
      containers:
        - name: server
          image: meta/streaming-api:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"

            # Uses the shared config created in step 2
            - name: SONG_ARCHIVE_DIR
              valueFrom:
                configMapKeyRef:
                  name: song-api-storage-config
                  key: archive_dir

            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: streaming-api-config
                  key: REDIS_ADDR

            - name: REDIS_DB
              valueFrom:
                configMapKeyRef:
                  name: streaming-api-config
                  key: REDIS_DB

            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: streaming-api-config
                  key: USER_SERVICE_URL
            
            - name: USER_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: streaming-api-config
                  key: USER_SERVICE_PORT

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-app-secrets
                  key: streaming-redis-creds

          volumeMounts:
            - name: media-storage
              mountPath: /app/media # Must match the value in song-api-storage-config

      volumes:
        - name: media-storage
          persistentVolumeClaim:
            # Connects to the exact same PVC as the song-api
            claimName: song-media-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: streaming-api
  namespace: default
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: streaming-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
