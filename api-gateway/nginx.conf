worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Docker's internal DNS resolver (allows Nginx to find containers by name)
    resolver 127.0.0.11 valid=30s;

    # --- Upstream Definitions ---
    # upstream user_service {
    #     server user-service:8080;
    # }

    upstream song_service {
        server song-service:8080;
    }

    upstream streaming_service {
        server streaming-service:8080;
    }

    # --- Gateway Server ---
    server {
        listen 80;
        server_name localhost;

        # Standard Proxy Headers (Ensures backends see the real user IP)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for better stability
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;

        # --- Route Definitions ---

        # 1. User Service
        # location /api/users/ {
        #     proxy_pass http://user_service/;
        # }

        # 2. Song Service
       location /api/songs/ {
            # Default for all other song routes
            proxy_pass http://song_service/;

            location /api/songs/upload {
                client_max_body_size 20M;
                # We explicitly tell it where to go inside the service
                proxy_pass http://song_service/upload;
            }
        }

        # 3. Streaming Service
        location /api/stream/ {
            proxy_pass http://streaming_service/;
        }

        # 4. Health Check (Directly from Gateway)
        location /health {
            add_header Content-Type text/plain;
            return 200 "API Gateway OK\n";
        }

        # Catch-all for undefined routes
        location / {
            return 404 "Route not found in API Gateway\n";
        }
    }
}