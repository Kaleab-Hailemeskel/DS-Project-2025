<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HLS Audio Seek Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .audio-card {
        background: #1e293b;
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 450px;
        text-align: center;
      }
      audio {
        width: 100%;
        margin: 1.5rem 0;
        filter: invert(100%) hue-rotate(180deg) brightness(1.5);
      }
      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      button {
        background: #38bdf8;
        color: #0f172a;
        border: none;
        padding: 0.75rem;
        border-radius: 0.5rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.1s, background 0.2s;
      }
      button:hover {
        background: #7dd3fc;
      }
      button:active {
        transform: scale(0.95);
      }
      .label {
        font-size: 0.8rem;
        color: #94a3b8;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div class="audio-card">
      <div class="label">Now Playing: HLS Audio Stream</div>
      <h2 style="margin: 0 0 1rem 0">Stream Demo</h2>

      <audio id="audio" controls></audio>

      <div class="label">Jump to Segment</div>
      <div class="btn-group">
        <button onclick="seekTo(0)">Restart</button>
        <button onclick="seekTo(10)">0:10s</button>
        <button onclick="seekTo(30)">0:30s</button>
        <button onclick="seekTo(60)">1:00m</button>
      </div>
      <p id="log" style="font-size: 0.75rem; color: #64748b; margin-top: 1rem">
        Waiting for manifest...
      </p>
    </div>

    <script>
      const audio = document.getElementById("audio");
      const log = document.getElementById("log");
      const streamSource =
        "http://song-app.test/streaming/streams/27dde0b0-7b82-49e9-bc5d-885eb0062b33/index.m3u8";

      // --- 1. SET YOUR TOKEN HERE ---
      const authToken = "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3Njc5OTQ0NDcsImlhdCI6MTc2Nzk5MDg0Nywic3ViIjoiMSJ9.LPdkblhoLPbRjZMQ8R9KMfCzGpMxKn0WI55BxSGv1J0";

      if (Hls.isSupported()) {
        // --- 2. CONFIGURE HLS WITH XHR SETUP ---
        const hls = new Hls({
          xhrSetup: function (xhr, url) {
            xhr.setRequestHeader("Authorization", authToken);
          },
        });

        hls.loadSource(streamSource);
        hls.attachMedia(audio);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          log.innerText = "Manifest parsed. Chunks mapped to timeline.";
        });

        hls.on(Hls.Events.FRAG_LOADED, (event, data) => {
          console.log("Fetched audio chunk:", data.frag.url);
          log.innerText = `Loaded chunk: ${data.frag.relurl}`;
        });

        // Error handling for Auth failures
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.response && data.response.code === 401) {
            log.innerText = "Error: Unauthorized (Invalid Token)";
          }
        });
      } else if (audio.canPlayType("application/vnd.apple.mpegurl")) {
        // Safari native does NOT easily support custom headers for HLS.
        // You usually have to use Cookies or Query Params for Safari.
        audio.src = streamSource;
      }

      function seekTo(seconds) {
        audio.currentTime = seconds;
        audio.play();
      }
    </script>
  </body>
</html>
